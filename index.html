<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Retro Player</title>
<style>
  :root{--bg:#0e0f13;--panel:#181a21;--line:#2a2d38;--fg:#e8e9ee;--dim:#8b8fa0;--accent:#e4572e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:17px;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  button,select{font:inherit;border-radius:6px}
  button{background:var(--accent);color:#fff;border:0;padding:8px 14px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  select{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:7px 10px}
  main{height:calc(100% - 50px);display:flex;align-items:center;justify-content:center;padding:16px}
  #drop{width:min(560px,100%);border:2px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;background:var(--panel);transition:.15s}
  #drop.over{border-color:var(--accent);background:#20212a}
  #drop h2{margin:0 0 6px;font-size:20px}
  #drop p{margin:8px 0;color:var(--dim)}
  .opts{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}
  .opts label{color:var(--dim);display:flex;align-items:center;gap:6px}
  #err{color:#ff7b7b;margin-top:12px;min-height:1.2em}
  #stage{display:none;width:100%;height:100%;max-width:1100px}
  #game{width:100%;height:100%}
  small{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1><span>Retro</span> player</h1>
  <button class="ghost" id="reset" style="display:none">Load another game</button>
</header>
<main>
  <div id="drop">
    <h2>Drop a game here</h2>
    <p>N64 (.z64 .n64 .v64) · SNES (.sfc .smc) · DS (.nds)</p>
    <div class="opts">
      <label>System
        <select id="system">
          <option value="auto">Auto-detect</option>
          <option value="n64">Nintendo 64</option>
          <option value="snes">Super Nintendo</option>
          <option value="nds">Nintendo DS</option>
        </select>
      </label>
      <label><input type="checkbox" id="legacy"> Legacy core (try if graphics flicker)</label>
    </div>
    <p><button id="pick">Choose file</button></p>
    <input type="file" id="file" hidden>
    <p><small>Use games you dumped from cartridges you own. Nothing is uploaded; the file stays in your browser.<br>
    For .zip files, pick the system manually.</small></p>
    <div id="err"></div>
  </div>
  <div id="stage"><div id="game"></div></div>
</main>

<script>
// Cache the emulator after the first online run so it works offline later (needs https).
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const EXT = {
  z64:'n64', n64:'n64', v64:'n64',
  sfc:'snes', smc:'snes', swc:'snes', fig:'snes',
  nds:'nds'
};

const drop = document.getElementById('drop');
const file = document.getElementById('file');
const stage = document.getElementById('stage');
const err = document.getElementById('err');
const sysSel = document.getElementById('system');
const legacy = document.getElementById('legacy');

try { legacy.checked = localStorage.getItem('legacy') === '1'; } catch(e) {}
legacy.onchange = () => { try { localStorage.setItem('legacy', legacy.checked ? '1' : '0'); } catch(e) {} };

document.getElementById('pick').onclick = () => file.click();
document.getElementById('reset').onclick = () => location.reload();
file.onchange = () => file.files[0] && start(file.files[0]);

['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) start(f); });

function start(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  let core = sysSel.value === 'auto' ? EXT[ext] : sysSel.value;
  if (!core) {
    err.textContent = ext === 'zip' || ext === '7z'
      ? 'For zip files, choose the system from the dropdown first.'
      : 'Unknown file type. Choose the system from the dropdown.';
    return;
  }
  err.textContent = '';
  drop.style.display = 'none';
  stage.style.display = 'block';
  document.getElementById('reset').style.display = '';

  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameUrl = URL.createObjectURL(f);
  window.EJS_gameName = f.name.replace(/\.[^.]+$/, '');
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#e4572e';
  window.EJS_threads = false;
  window.EJS_forceLegacyCores = legacy.checked;

  const s = document.createElement('script');
  s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = () => { err.textContent = 'Could not load the emulator. Connect to the internet once so it can be cached for offline use.'; drop.style.display=''; stage.style.display='none'; };
  document.body.appendChild(s);
}
</script>
</body>
</html>
